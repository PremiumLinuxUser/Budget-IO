<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget IO</title>
  <meta name="description" content="Budget IO: import bank CSVs, fill savings buckets, run monthly reports and crush your debt.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310b981'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3E$%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">$</span><span>Budget <b>IO</b></span></div>
    <nav id="tabs" aria-label="Sections">
      <button data-tab="dashboard">Dashboard</button>
      <button data-tab="transactions">Transactions</button>
      <button data-tab="buckets">Savings</button>
      <button data-tab="reports">Reports</button>
      <button data-tab="debts">Debt payoff</button>
    </nav>
    <div class="top-actions">
      <button class="btn primary" data-action="import">⬆ Upload CSV</button>
      <input type="file" id="csvFile" accept=".csv,text/csv,.txt" hidden>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <span>Your data stays in this browser (localStorage). Nothing is uploaded anywhere.</span>
    <span class="foot-links">
      <button class="link" data-action="export-json">Back up data</button>
      <button class="link" data-action="import-json">Restore backup</button>
      <button class="link danger" data-action="reset">Reset</button>
      <input type="file" id="jsonFile" accept=".json,application/json" hidden>
    </span>
  </footer>

  <dialog id="modal"><form method="dialog" id="modalForm"><h2 id="modalTitle"></h2><div id="modalBody"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
